# PLACEHOLDER until task F-06 publishes ../docs/api/admin-api.v1.yaml.
# scripts/generate-api.mjs uses the real contract automatically once it exists.
# Keep this stub minimal: it only lets the workspace build and the generator be exercised.
openapi: 3.1.0
info:
  title: AdminApi (stub)
  version: 0.0.0-stub
paths:
  /api/v1/me:
    get:
      operationId: getMe
      tags: [Me]
      responses:
        '200':
          description: The signed-in user's profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        default:
          description: Problem details (RFC 9457)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /api/v1/tenant:
    get:
      operationId: getTenant
      tags: [Tenant]
      responses:
        '200':
          description: Current tenant (taken from the token's tid)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantResponse' }
components:
  schemas:
    MeResponse:
      type: object
      required: [id, email, emailVerified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        name: { type: string }
    TenantResponse:
      type: object
      required: [id, slug, name, status]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        status: { type: string, enum: [Active, Suspended, PendingDeletion] }
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
