          type: string
          format: uuid
        domain:
          type: string
        status:
          type: string
          enum:
          - Pending
          - Verified
          - Failed
        txtRecordName:
          type: string
          examples:
          - _platform-verify.acme.com
        txtRecordValue:
          type: string
        verifiedAt:
          type:
          - string
          - 'null'
          format: date-time
        ssoEnforced:
          type: boolean
    AddDomainRequest:
      type: object
      required:
      - domain
      properties:
        domain:
          type: string
          format: hostname
    Branding:
      type: object
      required: []
      properties:
        logoUrl:
          type: string
          format: uri
        faviconUrl:
          type: string
          format: uri
        primaryColor:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        backgroundUrl:
          type: string
          format: uri
        textOverrides:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          description: locale → key → text
    TenantPolicies:
      type: object
      required:
      - password
      - mfa
      - session
      properties:
        password:
          type: object
          required:
          - minLength
          properties:
            minLength:
              type: integer
              minimum: 12
            breachCheck:
              type: boolean
              default: true
        mfa:
          type: object
          required:
          - required
          properties:
            required:
              type: string
              enum:
              - 'Off'
              - AdminsOnly
              - All
            allowedMethods:
              type: array
              items:
                type: string
                enum:
                - totp
                - passkey
                - recovery_code
        session:
          type: object
          required:
          - idleMinutes
          - absoluteHours
          properties:
            idleMinutes:
              type: integer
              minimum: 5
            absoluteHours:
              type: integer
              minimum: 1
            rememberDeviceDays:
              type: integer
              minimum: 0
        ipAllowList:
          type: array
          items:
            type: string
            description: CIDR
        version:
          type: integer
          format: int64
          description: Optimistic concurrency version. Send the version you read; a stale version returns 409 platform.concurrency_conflict.
    TenantGrant:
      type: object
      required:
      - id
      - granteeTenantId
      - roleId
      - scopeNodeId
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
        granteeTenantId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        scopeNodeId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    CreateTenantGrantRequest:
      type: object
      required:
