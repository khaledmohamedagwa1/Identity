      - maxCustomRoles
      properties:
        maxUsers:
          type: integer
          minimum: 0
        maxNodes:
          type: integer
          minimum: 0
        maxDepth:
          type: integer
          minimum: 0
        maxSsoConnections:
          type: integer
          minimum: 0
        maxCustomRoles:
          type: integer
          minimum: 0
    ImpersonationRequest:
      type: object
      required:
      - id
      - targetUserId
      - reason
      - status
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
        targetUserId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        reason:
          type: string
        status:
          type: string
          enum:
          - Pending
          - Approved
          - Rejected
          - Active
          - Ended
        expiresAt:
          type: string
          format: date-time
    CreateImpersonationRequest:
      type: object
