        roleId:
          type: string
          format: uuid
        scopeNodeId:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/InheritanceMode'
        validFrom:
          type:
          - string
          - 'null'
          format: date-time
        validUntil:
          type:
          - string
