      required:
      - subjectId
      - subjectType
      - subjectName
      - change
      - nodeIds
      properties:
        subjectId:
          type: string
          format: uuid
        subjectType:
          $ref: '#/components/schemas/SubjectType'
        subjectName:
          type: string
        change:
          type: string
          enum:
          - Gains
          - Loses
        nodeIds:
          type: array
          items:
            type: string
            format: uuid
        permissions:
          type: array
          items:
            type: string
    Violation:
      type: object
