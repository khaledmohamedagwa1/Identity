components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token with aud = AdminApi resource. Portals use it via the BFF (no tokens in the browser).
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from a previous page.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 200
      description: 'Retry-safe creation: repeating the key returns the first result.'
  headers:
    XAuthzRevision:
      description: Authorization revision of this write (per tenant, commit-ordered; ADR-0017).
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: Validation failed (code platform.validation_failed or a domain code).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Not permitted, or tenant context missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found or not visible in this tenant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 'Conflict: duplicate, illegal state change or stale version (platform.concurrency_conflict).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limited; see Retry-After.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri-reference
          examples:
          - urn:platform:error:org.node.cycle
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable error code.
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field errors (validation only).
    TenantStatus:
      type: string
      enum:
      - Active
      - Suspended
      - PendingDeletion
      - Deleted
    Tenant:
      type: object
      required:
      - id
      - slug
      - name
      - status
      - planId
      - createdAt
      - version
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{1,38}[a-z0-9])$
        name:
          type: string
        status:
          $ref: '#/components/schemas/TenantStatus'
        planId:
          type: string
          format: uuid
        parentTenantId:
          type:
          - string
          - 'null'
          format: uuid
        selfSignupPolicy:
          $ref: '#/components/schemas/SelfSignupPolicy'
        defaultLocale:
          type: string
          enum:
          - en
          - ar
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Optimistic concurrency version. Send the version you read; a stale version returns 409 platform.concurrency_conflict.
    SelfSignupPolicy:
      type: string
      enum:
      - InviteOnly
      - VerifiedDomainAutoJoin
      - VerifiedDomainWithApproval
      - Open
      description: G-18. Default InviteOnly.
    CreateTenantRequest:
      type: object
      required:
      - slug
      - name
      - planId
      - ownerEmail
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{1,38}[a-z0-9])$
        name:
          type: string
          minLength: 1
          maxLength: 200
        planId:
          type: string
          format: uuid
        ownerEmail:
          type: string
          format: email
        parentTenantId:
          type:
          - string
          - 'null'
          format: uuid
    UpdateTenantRequest:
      type: object
      required:
      - version
      properties:
        name:
          type: string
          maxLength: 200
        planId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          description: Optimistic concurrency version. Send the version you read; a stale version returns 409 platform.concurrency_conflict.
    UpdateTenantSettingsRequest:
      type: object
      required:
      - version
      properties:
        name:
          type: string
          maxLength: 200
        selfSignupPolicy:
          $ref: '#/components/schemas/SelfSignupPolicy'
        defaultLocale:
          type: string
          enum:
          - en
          - ar
        version:
          type: integer
          format: int64
          description: Optimistic concurrency version. Send the version you read; a stale version returns 409 platform.concurrency_conflict.
    ReasonRequest:
      type: object
      required: []
      properties:
        reason:
          type: string
          maxLength: 500
    VersionedRequest:
      type: object
      required:
      - version
      properties:
        version:
          type: integer
          format: int64
          description: Optimistic concurrency version. Send the version you read; a stale version returns 409 platform.concurrency_conflict.
    Plan:
      type: object
      required:
      - id
      - name
      - limits
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        limits:
          $ref: '#/components/schemas/PlanLimits'
    PlanInput:
      type: object
      required:
      - name
      - limits
      properties:
        name:
          type: string
        limits:
          $ref: '#/components/schemas/PlanLimits'
    PlanLimits:
      type: object
