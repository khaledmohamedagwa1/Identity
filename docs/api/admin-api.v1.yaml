# Identity Platform Admin API v1 - frozen at G0 (F-06). Changes need a contract-change PR (docs/contract-changes/).
openapi: 3.1.0
info:
  title: Identity Platform Admin API
  version: 1.0.0
  description: Management REST API for the admin and account portals and for automation (spec section 9.4). The tenant is always taken from the
    access token's `tid` claim, never from a header or path. Writes return `X-Authz-Revision`; pass it as `minRevision` to the PDP for read-your-writes
    (section 5.5). Errors are RFC 9457 Problem Details with a stable `code`. Endpoints marked (P2)/(P3) are frozen in shape now and implemented
    in that phase. Additive changes only within v1 (ADR-0011).
  license:
    name: Proprietary
  contact:
    name: Platform team (lane L0)
servers:
- url: /api/v1
security:
- bearer: []
tags:
- name: Platform
- name: Tenant
- name: Organization
- name: Members
- name: Access
- name: Clients
- name: Federation
- name: Audit
- name: Me
paths:
  /platform/tenants:
    get:
      operationId: listTenants
      summary: List tenants
      tags:
      - Platform
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    description: Opaque cursor for the next page; null on the last page.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      description: Requires permission `platform_tenants_read`.
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: q
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/TenantStatus'
    post:
      operationId: createTenant
      summary: Create a tenant (UC-01)
      tags:
      - Platform
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
          headers:
            X-Authz-Revision:
              $ref: '#/components/headers/XAuthzRevision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      description: Creates the tenant, its root org node and the owner invitation (through events). Requires permission `platform_tenants_manage`.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
  /platform/tenants/{id}:
    get:
      operationId: getTenant
      summary: Get a tenant
      tags:
      - Platform
      responses:
        '200':
          description: OK
          content:
