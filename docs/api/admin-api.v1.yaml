          maxLength: 100
        allowedChildTypeIds:
          type: array
          items:
            type: string
            format: uuid
        maxDepth:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 15
    NodeStatus:
      type: string
      enum:
      - Active
      - Suspended
      - Archived
    OrgNode:
      type: object
      required:
      - id
      - parentId
      - typeId
      - name
      - status
      - inheritanceBlocked
      - hasChildren
      - childCount
      - depth
      - version
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type:
          - string
          - 'null'
          format: uuid
        typeId:
          type: string
          format: uuid
        name:
          type: string
        code:
          type:
          - string
          - 'null'
        status:
